[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csc410-ltl-prover"
version = "0.1.0"
description = "An axiom-based LTL prover"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.13,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["ltl", "c1_checker", "c2_propositional", "c3_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
